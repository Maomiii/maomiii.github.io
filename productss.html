<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>網頁建構中 ｜ 毛咪 Maomi</title>
<meta name="description" content="毛咪 Maomi 手作蕾絲領巾 - 網頁建構中">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  :root {
    --bg-base: #faf6f1;
    --bg-card: #ffffff;
    --mauve-deep: #7a4a58;
    --mauve: #a87d8a;
    --mauve-soft: #d4a8b3;
    --mauve-mist: #f0dde2;
    --pink-main: #c599a4;
    --text-main: #3d2a30;
    --text-soft: #7a5d65;
  }

  html, body {
    overflow-x: hidden;
  }

  body {
    font-family: 'Noto Sans TC', 'Quicksand', sans-serif;
    background: var(--bg-base);
    color: var(--text-main);
    min-height: 100vh;
    line-height: 1.5;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 20px;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: var(--bg-base);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 2;
    max-width: 420px;
    width: 100%;
    padding: 50px 30px;
    text-align: center;
    background: #fffdfa;
    border-radius: 32px;
    box-shadow:
      0 20px 60px rgba(168, 125, 138, 0.15),
      0 0 0 1px rgba(212, 168, 179, 0.15);
    opacity: 0;
    animation: fadeUp 0.7s ease-out forwards;
  }

  /* 插畫圖示 */
  .illustration {
    width: 140px;
    height: 140px;
    margin: 0 auto 24px;
    position: relative;
    opacity: 0;
    animation: fadeUp 0.7s ease-out 0.2s forwards;
  }

  .illustration .circle-bg {
    position: absolute;
    inset: 0;
    background: var(--mauve-mist);
    border-radius: 50%;
  }

  .illustration svg {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
  }

  /* 浮動動畫的小裝飾點 */
  .dot {
    position: absolute;
    border-radius: 50%;
    background: var(--mauve-soft);
    animation: float 3s ease-in-out infinite;
  }

  .dot.d1 {
    width: 10px;
    height: 10px;
    top: -4px;
    right: 8px;
    animation-delay: 0s;
  }

  .dot.d2 {
    width: 7px;
    height: 7px;
    bottom: 10px;
    left: -2px;
    animation-delay: 0.5s;
    background: var(--pink-main);
  }

  .dot.d3 {
    width: 6px;
    height: 6px;
    top: 30px;
    right: -4px;
    animation-delay: 1s;
    background: var(--mauve);
  }

  /* 標題 */
  .title-zh {
    font-size: 22px;
    font-weight: 700;
    color: var(--mauve-deep);
    letter-spacing: 4px;
    margin-bottom: 8px;
    opacity: 0;
    animation: fadeUp 0.6s ease-out 0.35s forwards;
  }

  .title-en {
    font-family: 'Quicksand', sans-serif;
    font-size: 13px;
    color: var(--mauve);
    letter-spacing: 3px;
    font-weight: 500;
    margin-bottom: 20px;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeUp 0.6s ease-out 0.45s forwards;
  }

  /* 分隔小點 */
  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 20px;
    opacity: 0;
    animation: fadeIn 0.6s ease-out 0.55s forwards;
  }

  .divider span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--mauve-soft);
  }

  .divider span:nth-child(2) {
    background: var(--pink-main);
    width: 8px;
    height: 8px;
  }

  /* 訊息 */
  .message {
    font-size: 14px;
    color: var(--text-soft);
    letter-spacing: 1.5px;
    line-height: 1.8;
    margin-bottom: 30px;
    opacity: 0;
    animation: fadeUp 0.6s ease-out 0.6s forwards;
  }

  .message .highlight {
    color: var(--mauve-deep);
    font-weight: 600;
  }

  /* 回首頁按鈕 */
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--pink-main);
    color: var(--bg-base);
    text-decoration: none;
    padding: 12px 28px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 2px;
    box-shadow: 0 4px 14px rgba(168, 125, 138, 0.25);
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    opacity: 0;
    animation: fadeUp 0.6s ease-out 0.7s forwards;
  }

  .back-btn:active { transform: scale(0.97); }

  @media (hover: hover) {
    .back-btn:hover {
      background: var(--mauve);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(168, 125, 138, 0.32);
    }
  }

  .back-btn svg {
    width: 14px;
    height: 14px;
  }

  /* 小品牌標記 */
  .brand-mark {
    margin-top: 28px;
    font-family: 'Quicksand', sans-serif;
    font-size: 11px;
    color: var(--mauve-soft);
    letter-spacing: 3px;
    font-weight: 500;
    opacity: 0;
    animation: fadeIn 0.8s ease-out 0.85s forwards;
  }

  /* 動畫 */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  @media (max-width: 360px) {
    .container { padding: 40px 22px; }
    .illustration { width: 120px; height: 120px; }
    .title-zh { font-size: 20px; }
  }
</style>
</head>
<body>

<div class="container">

  <div class="illustration">
    <div class="circle-bg"></div>
    <span class="dot d1"></span>
    <span class="dot d2"></span>
    <span class="dot d3"></span>
    <svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
      <!-- 小貓臉 -->
      <g transform="translate(70, 65)">
        <!-- 左耳 -->
        <path d="M -28 -10 L -22 -28 L -14 -16 Z" fill="#c599a4"/>
        <path d="M -25 -13 L -22 -22 L -17 -16 Z" fill="#f0dde2"/>
        <!-- 右耳 -->
        <path d="M 28 -10 L 22 -28 L 14 -16 Z" fill="#c599a4"/>
        <path d="M 25 -13 L 22 -22 L 17 -16 Z" fill="#f0dde2"/>
        <!-- 臉 -->
        <circle cx="0" cy="0" r="24" fill="#c599a4"/>
        <!-- 內臉 -->
        <circle cx="0" cy="4" r="18" fill="#fffdfa"/>
        <!-- 眼睛（閉著像專心） -->
        <path d="M -10 -2 Q -7 -5 -4 -2" stroke="#7a4a58" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M 4 -2 Q 7 -5 10 -2" stroke="#7a4a58" stroke-width="2" fill="none" stroke-linecap="round"/>
        <!-- 鼻子 -->
        <path d="M -2 3 L 2 3 L 0 6 Z" fill="#a87d8a"/>
        <!-- 嘴 -->
        <path d="M 0 6 Q -2 9 -4 8" stroke="#a87d8a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path d="M 0 6 Q 2 9 4 8" stroke="#a87d8a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <!-- 腮紅 -->
        <ellipse cx="-12" cy="5" rx="3" ry="1.8" fill="#f0dde2" opacity="0.7"/>
        <ellipse cx="12" cy="5" rx="3" ry="1.8" fill="#f0dde2" opacity="0.7"/>
      </g>
      <!-- 縫衣針線（在小貓下方） -->
      <g transform="translate(70, 110)">
        <!-- 線軸 -->
        <rect x="-22" y="-4" width="14" height="14" rx="2" fill="#d4b5a0"/>
        <rect x="-22" y="-4" width="14" height="3" fill="#a87d8a"/>
        <rect x="-22" y="7" width="14" height="3" fill="#a87d8a"/>
        <!-- 線 -->
        <path d="M -8 3 Q 0 0 8 -2" stroke="#7a4a58" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <!-- 針 -->
        <line x1="8" y1="-2" x2="20" y2="-6" stroke="#7a5d65" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="20" cy="-6" r="1.5" fill="#7a5d65"/>
      </g>
    </svg>
  </div>

  <h1 class="title-zh">網 頁 建 構 中</h1>
  <p class="title-en">Under Construction</p>

  <div class="divider">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <p class="message">
    這個頁面正在<span class="highlight">用心製作中</span><br>
    請稍候片刻再回來看看
  </p>

  <a href="index.html" class="back-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    回到首頁
  </a>

  <div class="brand-mark">— Maomi —</div>

</div>

</body>
</html>
