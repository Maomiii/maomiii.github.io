<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>商品款式 ｜ 毛咪 Maomi</title>
<meta name="description" content="毛咪 Maomi 手作蕾絲領巾 商品款式">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  :root {
    --bg-base: #faf6f1;
    --bg-card: #ffffff;
    --mauve-deep: #7a4a58;
    --mauve: #a87d8a;
    --mauve-soft: #d4a8b3;
    --mauve-mist: #f0dde2;
    --pink-light: #fce8ec;
    --text-main: #3d2a30;
    --text-soft: #7a5d65;
    --pink-main: #c599a4;
  }

  html, body {
    overflow-x: hidden;
  }

  body {
    font-family: 'Noto Sans TC', 'Quicksand', sans-serif;
    background: var(--bg-base);
    color: var(--text-main);
    min-height: 100vh;
    line-height: 1.5;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: var(--bg-base);
    pointer-events: none;
    z-index: 0;
  }

  @media (min-width: 768px) {
    body {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 20px;
    }
  }

  .container {
    position: relative;
    z-index: 2;
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 18px 40px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  @media (min-width: 768px) {
    .container {
      min-height: auto;
      width: 100%;
      max-width: 480px;
      padding: 40px 24px;
      background: #fffdfa;
      border-radius: 32px;
      box-shadow:
        0 20px 60px rgba(168, 125, 138, 0.15),
        0 0 0 1px rgba(212, 168, 179, 0.15);
    }
  }

  .header {
    text-align: center;
    margin-bottom: 20px;
    opacity: 0;
    animation: fadeUp 0.7s ease-out 0.1s forwards;
  }

  .logo-wrap {
    width: 68px;
    height: 68px;
    margin: 0 auto 10px;
    border-radius: 50%;
    overflow: hidden;
    box-shadow:
      0 0 0 3px var(--bg-base),
      0 0 0 4px var(--mauve-soft),
      0 6px 18px rgba(168, 125, 138, 0.2);
  }

  .logo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .brand-name {
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 3px;
    color: var(--mauve-deep);
    margin-bottom: 8px;
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 10px;
  }

  .brand-name .zh {
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 20px;
    letter-spacing: 2px;
    font-weight: 600;
    color: var(--mauve-deep);
  }

  .brand-tag {
    display: inline-block;
    font-size: 11px;
    color: var(--mauve);
    letter-spacing: 2px;
    padding: 4px 14px;
    border-top: 1px solid var(--mauve-mist);
    border-bottom: 1px solid var(--mauve-mist);
    font-weight: 500;
  }

  .back-home {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: var(--mauve);
    text-decoration: none;
    font-size: 12px;
    letter-spacing: 2px;
    margin-bottom: 16px;
    align-self: flex-start;
    font-weight: 500;
    opacity: 0;
    animation: fadeIn 0.6s ease-out 0.2s forwards;
  }

  .back-home::before {
    content: "‹";
    font-size: 18px;
    line-height: 1;
  }

  .back-home:hover { color: var(--mauve-deep); }

  .page-title {
    text-align: center;
    margin-bottom: 6px;
    font-size: 14px;
    color: var(--mauve-deep);
    letter-spacing: 5px;
    font-weight: 600;
    opacity: 0;
    animation: fadeUp 0.6s ease-out 0.25s forwards;
  }

  .page-title::before,
  .page-title::after {
    content: "·";
    margin: 0 10px;
    color: var(--mauve-soft);
  }

  .page-desc {
    text-align: center;
    color: var(--mauve);
    font-size: 11px;
    letter-spacing: 2px;
    margin-bottom: 22px;
    font-family: 'Quicksand', sans-serif;
    font-weight: 500;
    opacity: 0;
    animation: fadeUp 0.6s ease-out 0.3s forwards;
  }

  .products {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .product-card {
    background: var(--bg-card);
    border-radius: 22px;
    padding: 12px 10px;
    box-shadow: 0 3px 10px rgba(168, 125, 138, 0.12);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    display: flex;
    flex-direction: column;
    opacity: 0;
    animation: fadeUp 0.5s ease-out forwards;
  }

  .product-card:nth-child(1) { animation-delay: 0.35s; }
  .product-card:nth-child(2) { animation-delay: 0.42s; }
  .product-card:nth-child(3) { animation-delay: 0.49s; }
  .product-card:nth-child(4) { animation-delay: 0.56s; }
  .product-card:nth-child(5) { animation-delay: 0.63s; }
  .product-card:nth-child(6) { animation-delay: 0.7s; }

  @media (hover: hover) {
    .product-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(168, 125, 138, 0.2);
    }
  }

  .product-image-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 14px;
    overflow: hidden;
    background: var(--mauve-mist);
    margin-bottom: 10px;
  }

  .product-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: opacity 0.3s ease;
  }

  .product-image.fading { opacity: 0; }

  .product-name {
    font-size: 13px;
    font-weight: 700;
    color: var(--mauve-deep);
    text-align: center;
    letter-spacing: 1.5px;
    margin-bottom: 2px;
  }

  .product-name-en {
    font-family: 'Quicksand', sans-serif;
    font-size: 10px;
    color: var(--mauve);
    text-align: center;
    letter-spacing: 1px;
    margin-bottom: 10px;
    font-weight: 500;
  }

  .color-label {
    text-align: center;
    font-size: 10px;
    color: var(--text-soft);
    letter-spacing: 2px;
    margin-bottom: 8px;
    min-height: 14px;
  }

  .color-label .current {
    color: var(--mauve-deep);
    font-weight: 600;
  }

  .color-swatches {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }

  .swatch {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid var(--bg-card);
    box-shadow: 0 0 0 1.5px var(--mauve-mist);
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    padding: 0;
  }

  .swatch:hover { transform: scale(1.1); }

  .swatch.active {
    box-shadow: 0 0 0 2px var(--mauve-deep);
    transform: scale(1.08);
  }

  .shop-buttons {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: auto;
  }

  .shop-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    background: var(--pink-main);
    color: var(--bg-base);
    text-decoration: none;
    padding: 8px 10px;
    border-radius: 999px;
    transition: background 0.2s ease, transform 0.15s ease;
    font-size: 11px;
    letter-spacing: 1px;
    font-weight: 600;
    box-shadow: 0 2px 6px rgba(168, 125, 138, 0.18);
  }

  @media (hover: hover) {
    .shop-btn:hover {
      background: var(--mauve);
      transform: translateY(-1px);
    }
  }

  .shop-btn:active { transform: scale(0.97); }

  .shop-btn svg {
    width: 13px;
    height: 13px;
    flex-shrink: 0;
  }

  .shop-btn.disabled {
    background: #d8cfc7;
    color: var(--bg-base);
    cursor: not-allowed;
    pointer-events: none;
    box-shadow: none;
    opacity: 0.8;
  }

  .footer {
    text-align: center;
    margin-top: 28px;
    opacity: 0;
    animation: fadeIn 0.8s ease-out 0.8s forwards;
  }

  .copyright {
    font-family: 'Quicksand', sans-serif;
    font-size: 10px;
    color: var(--mauve-soft);
    letter-spacing: 2px;
    font-weight: 500;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @media (min-width: 768px) {

    .product-card { padding: 14px 12px; border-radius: 24px; }
    .product-name { font-size: 14px; }
    .product-name-en { font-size: 11px; }
    .shop-btn { font-size: 12px; padding: 9px 12px; }
    .swatch { width: 26px; height: 26px; }
  }

  @media (max-width: 360px) {
    .container { padding: 20px 14px 30px; }
    .products { gap: 10px; }
    .product-card { padding: 10px 8px; }
    .swatch { width: 22px; height: 22px; }
  }
</style>
</head>

<script>
  document.querySelectorAll('.product-card').forEach(card => {
    const swatches = card.querySelectorAll('.swatch');
    const image = card.querySelector('.product-image');
    const label = card.querySelector('.color-label .current');
    const productName = card.querySelector('.product-name').textContent;

    swatches.forEach(swatch => {
      swatch.addEventListener('click', () => {
        if (swatch.classList.contains('active')) return;

        const newImg = swatch.dataset.img;
        const newColor = swatch.dataset.color;

        swatches.forEach(s => s.classList.remove('active'));
        swatch.classList.add('active');

        label.textContent = newColor;

        image.classList.add('fading');
        setTimeout(() => {
          image.src = newImg;
          image.alt = `${productName} - ${newColor}`;
          image.classList.remove('fading');
        }, 200);
      });
    });
  });
</script>
