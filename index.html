<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>毛咪 Maomi｜手作蕾絲領巾</title>
<meta name="description" content="毛咪 Maomi 手作蕾絲領巾">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  :root {
    --bg-base: #faf6f1;
    --bg-card: #ffffff;
    --mauve-deep: #7a4a58;
    --mauve: #a87d8a;
    --mauve-soft: #d4a8b3;
    --mauve-mist: #f0dde2;
    --pink-light: #fce8ec;
    --text-main: #3d2a30;
    --text-soft: #7a5d65;
  }

  html, body {
    overflow-x: hidden;
  }

  body {
    font-family: 'Noto Sans TC', 'Quicksand', sans-serif;
    background: var(--bg-base);
    color: var(--text-main);
    min-height: 100vh;
    line-height: 1.5;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: var(--bg-base);
    pointer-events: none;
    z-index: 0;
  }

  @media (min-width: 768px) {
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
  }

  .container {
    position: relative;
    z-index: 2;
    max-width: 420px;
    margin: 0 auto;
    padding: 24px 22px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  @media (min-width: 768px) {
    .container {
      min-height: auto;
      width: 100%;
      max-width: 420px;
      padding: 40px 28px;
      background: #fffdfa;
      border-radius: 32px;
      box-shadow:
        0 20px 60px rgba(168, 125, 138, 0.15),
        0 0 0 1px rgba(212, 168, 179, 0.15);
    }
  }

  .header {
    text-align: center;
    margin-bottom: 24px;
    opacity: 0;
    animation: fadeUp 0.7s ease-out 0.1s forwards;
  }

  .logo-wrap {
    width: 78px;
    height: 78px;
    margin: 0 auto 10px;
    border-radius: 50%;
    overflow: hidden;
    box-shadow:
      0 0 0 3px var(--bg-base),
      0 0 0 4px var(--mauve-soft),
      0 6px 18px rgba(168, 125, 138, 0.2);
  }

  .logo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .brand-name {
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 18px;
    letter-spacing: 3px;
    color: var(--mauve-deep);
    margin-bottom: 8px;
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 10px;
  }

  .brand-name .zh {
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 22px;
    letter-spacing: 2px;
    font-weight: 600;
    color: var(--mauve-deep);
  }

  .brand-tag {
    display: inline-block;
    font-size: 11px;
    color: var(--mauve);
    letter-spacing: 2px;
    padding: 4px 14px;
    border-top: 1px solid var(--mauve-mist);
    border-bottom: 1px solid var(--mauve-mist);
    font-weight: 500;
  }

  /* 小公告 */
  .announcement {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: #ffffff;
    border: 1.5px solid var(--mauve-soft);
    border-radius: 999px;
    padding: 10px 18px;
    margin-bottom: 18px;
    color: var(--mauve-deep);
    font-size: 12px;
    letter-spacing: 1.5px;
    font-weight: 500;
    box-shadow: 0 2px 8px rgba(168, 125, 138, 0.08);
    opacity: 0;
    animation: fadeUp 0.6s ease-out 0.2s forwards;
  }

  .announcement svg {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    color: var(--mauve);
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
  }

  .link-card {
    background: #c599a4;
    border-radius: 28px;
    padding: 14px 18px;
    text-decoration: none;
    color: #faf6f1;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow:
      0 3px 10px rgba(168, 125, 138, 0.2);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    position: relative;
    overflow: hidden;
    opacity: 0;
    animation: fadeUp 0.5s ease-out forwards;
  }

  .link-card:nth-child(1) { animation-delay: 0.3s; }
  .link-card:nth-child(2) { animation-delay: 0.37s; }
  .link-card:nth-child(3) { animation-delay: 0.44s; }
  .link-card:nth-child(4) { animation-delay: 0.51s; }
  .link-card:nth-child(5) { animation-delay: 0.58s; }

  .link-card:active {
    transform: scale(0.98);
  }

  @media (hover: hover) {
    .link-card:hover {
      transform: translateY(-2px);
      box-shadow:
        0 8px 18px rgba(168, 125, 138, 0.28);
    }
    .link-card:hover .link-arrow {
      transform: translateX(3px);
    }
  }

  .link-icon {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    background: #faf6f1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: #c599a4;
  }

  .link-icon svg {
    width: 20px;
    height: 20px;
  }

  .link-content {
    flex: 1;
    min-width: 0;
  }

  .link-title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #faf6f1;
    margin-bottom: 1px;
  }

  .link-desc {
    font-family: 'Quicksand', sans-serif;
    font-size: 11px;
    color: rgba(250, 246, 241, 0.8);
    letter-spacing: 0.5px;
    font-weight: 500;
  }

  .link-arrow {
    color: #faf6f1;
    transition: transform 0.25s ease;
    flex-shrink: 0;
  }

  .footer {
    text-align: center;
    margin-top: 18px;
    opacity: 0;
    animation: fadeIn 0.8s ease-out 0.75s forwards;
  }

  .footer-text {
    font-size: 11px;
    color: var(--text-soft);
    letter-spacing: 2px;
    font-weight: 500;
  }

  .copyright {
    margin-top: 6px;
    font-family: 'Quicksand', sans-serif;
    font-size: 10px;
    color: var(--mauve-soft);
    letter-spacing: 2px;
    font-weight: 500;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @media (max-height: 700px) {
    .container { padding: 18px 22px; }
    .header { margin-bottom: 18px; }
    .logo-wrap { width: 68px; height: 68px; margin-bottom: 8px; }
    .brand-name { font-size: 20px; }
    .announcement { padding: 8px 14px; margin-bottom: 14px; }
    .links { gap: 8px; }
    .link-card { padding: 12px 16px; }
  }

  @media (max-width: 360px) {
    .brand-name { font-size: 20px; }
    .link-title { font-size: 14px; }
    .announcement { font-size: 11px; padding: 9px 14px; }
  }
</style>
</head>
<body>

</body>
</html>
